<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wakedonalds Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .category {
            margin-bottom: 40px;
        }

        .category h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .menu-item {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .menu-item h3 {
            margin-top: 0;
        }

        .price {
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>Wakedonalds Menu</h1>
    <p>Browse our menu by category</p>
</header>

<div class="container">

    {% for category, items in categories.items %}

        <section class="category">
            <h2>{{ category }}</h2>

            <div class="menu-grid">

                {% for item in items %}

                    <div class="menu-item">
                        <h3>{{ item.name }}</h3>
                        <p>{{ item.description }}</p>
                        <p class="price">${{ item.price }}</p>
                    </div>

                {% endfor %}

            </div>
        </section>

    {% endfor %}

</div>

</body>
</html>
